name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install pytest
      - run: pytest
      - name: Tables and figure match results/results.json
        run: |
          python -m audit.report
          python -m audit.figure
          git diff --exit-code

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libgirepository-2.0-dev pkg-config libegl1 libgl1 libxkbcommon0 libfontconfig1
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Every library that installs here reproduces the stored counts
        run: python -m audit.run --check
